name: CobbleClub Fabric 1.21.1 Build

on:
  push:
    branches:
      - cobbleclub-1.21.1-fabric
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build CobbleClub port
        run: ./gradlew clean build --stacktrace --no-daemon

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: cobbleclub-dimthreads-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
